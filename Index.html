<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Index.css">
    <script src="Index.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarlosSays</title>
</head>
<body>
    <!-- Página de inicio -->
    <div id="welcome-page">
        <h1>Bienvenido</h1>
        <h1>SCORE:</h1>
        <p>¿Quién eres?</p>
        <input type="text" id="player-name">
        <button id="startbutton" type="button">Start Game</button>
        <h2>Menú de victorias</h2>
        <ul id="scores-list"></ul>
        <button id="clear-scores-button">Clear Scores</button>
    </div>
    
    <!-- Página del juego -->
    <div id="game-page" style="display: none;">
        <h1>SCORE: <span id="current-score">0</span></h1>

        <div class="button-container"> 
            <button class="color-btn red" id="red">Red</button>
            <button class="color-btn yellow" id="yellow">Yellow</button>
            <button class="color-btn blue" id="blue">Blue</button>
            <button class="color-btn green" id="green">Green</button>
        </div>

        <button id="start-sequence">Start Sequence</button>

        <div class="home-container">
            <button id="homebutton">HOME</button>
        </div>
    </div>
</body>
</html>
