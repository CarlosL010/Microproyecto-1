<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Index.css">
    <script src="Index.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimonSays</title>


    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Fuente de videojuego -->
</head>

<body>
    <!-- Página de inicio -->
    <div id="welcome-page">
        <h1>Bienvenido</h1>
        <h1>SCORE:</h1>
        <p>¿Quién eres?</p>
        <div class="input-button-container">
            <input type="text" id="player-name">
            <button id="startbutton" type="button">Start Game</button>
        </div>
        <audio id="sonido" src="Bienvenida.mp3"></audio>
        <h2>Record de puntuación</h2>
        <ul id="scores-list"></ul>
        <button id="clear-scores-button">Clear Scores</button>
    </div>

    <!-- pagina del juego -->
    <div id="game-page" style="display: none;">
        <h1>SCORE: <span id="current-score">0</span></h1>

        <div class="button-container">
            <button class="color-btn red" id="red"></button>
            <button class="color-btn yellow" id="yellow"></button>
            <button class="color-btn blue" id="blue"></button>
            <button class="color-btn green" id="green"></button>
        </div>

        <button id="start-sequence">Start Sequence</button>

        <div class="home-container">
            <button id="homebutton">HOME</button>
        </div>
        <audio id="red-sound" src="red.mp3"></audio>
        <audio id="blue-sound" src="blue.mp3"></audio>
        <audio id="green-sound" src="green.mp3"></audio>
        <audio id="yellow-sound" src="yellow.mp3"></audio>

    </div>
</body>

</html>
